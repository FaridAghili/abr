# Setup manages shared runtimes; application .env values are owner-managed.
# The range controls new automatic allocations; saved/imported ports stay stable.
[ports]
first = 10000
last = 19999

[[apps]]
name = "mango"
directory = "/srv/apps/mango"
user = "sites-mango"
type = "laravel"
domain = "mango.example.com"
aliases = ["www.mango.example.com"]
domains = ["api.mango.example.com"]
health_check = "https://mango.example.com/up"
[apps.web]
driver = "octane"
workers = 2
[apps.queue]
workers = 2
[apps.scheduler]
enabled = true
[apps.nightwatch]
enabled = true
[apps.inertia_ssr]
enabled = false

[[apps]]
name = "quiet"
directory = "/srv/apps/quiet"
user = "sites-quiet"
type = "laravel"
domain = "quiet.example.com"
[apps.web]
driver = "fpm"
[apps.queue]
workers = 1
[apps.scheduler]
enabled = true

[[apps]]
name = "frontend"
directory = "/srv/apps/frontend"
user = "sites-frontend"
type = "nuxt"
domain = "frontend.example.com"
