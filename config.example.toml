# Setup manages shared runtimes; application .env values are owner-managed.
# The range controls new automatic allocations; saved/imported ports stay stable.
[ports]
first = 10000
last = 19999

[[apps]]
name = "api"
directory = "/srv/apps/api"
user = "abr-api"
type = "laravel"
domain = "api.example.com"
# Separate subdomain apps keep their entered hostname without www aliases.
health_check = "https://api.example.com/up"
[apps.database]
enabled = true
[apps.web]
driver = "octane"
workers = 2
[apps.queue]
workers = 2
[apps.scheduler]
enabled = true
[apps.nightwatch]
enabled = true
[apps.inertia_ssr]
enabled = false

[[apps]]
name = "portal"
directory = "/srv/apps/portal"
user = "abr-portal"
type = "laravel"
domain = "portal.example.com"
[apps.database]
enabled = true
[apps.web]
driver = "fpm"
[apps.queue]
workers = 1
[apps.scheduler]
enabled = true

[[apps]]
name = "frontend"
directory = "/srv/apps/frontend"
user = "abr-frontend"
type = "nuxt"
domain = "www.example.com"
# Canonical preference is stored as the domain and its explicit redirect aliases.
aliases = ["example.com"]
