name: Check and package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Ubuntu checks, build and host test
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          # Include the pinned CI tools in the dependency/build cache key.
          cache-dependency-path: |
            go.mod
            go.sum
            .github/workflows/ci.yml
      - name: Check formatting
        run: |
          files=$(git ls-files -z '*.go' | xargs -0 gofmt -l)
          if [ -n "$files" ]; then
            echo "Run gofmt on:"
            echo "$files"
            exit 1
          fi
      - name: Validate workflow
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Verify dependencies and scan reachable vulnerabilities
        run: |
          go mod verify
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Build Linux AMD64
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -trimpath -ldflags '-s -w' -o dist/abr-linux-amd64 ./cmd/abr
      - name: Setup from a standalone binary and deploy Laravel and Nuxt
        id: host
        timeout-minutes: 25
        run: bash scripts/host-smoke.sh dist/abr-linux-amd64
      - name: Host diagnostics on failure
        if: failure() && steps.host.outcome == 'failure'
        run: |
          sudo systemctl --no-pager --full status caddy php8.5-fpm mysql abr-fixture-php-scheduler.service abr-fixture-php-scheduler.timer abr-fixture-octane-octane.service || true
          sudo journalctl --no-pager -b -n 300 || true
          sudo namei -l /etc/apt/keyrings/abr/caddy.gpg /opt/roadrunner /usr/local/bin/composer || true
          sudo stat -c '%U:%G %a %n' /etc/redis /etc/redis/redis.conf /etc/redis/abr.conf || true
          sudo namei -l /var/lib/abr-ci/git/id_ed25519 || true
          sudo getfacl -p /var/lib/abr-ci /var/lib/abr-ci/git /var/lib/abr-ci/git/id_ed25519 /var/lib/abr-ci/git/known_hosts || true
          if getent passwd abr-fixture-php >/dev/null; then
            sudo runuser --user abr-fixture-php -- env -i HOME=/var/lib/abr-users/abr-fixture-php PATH=/usr/bin:/bin git -C /srv/apps/fixture-php status --porcelain || true
          fi
      - name: Upload tested binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: dist/abr-linux-amd64
          archive: false
          if-no-files-found: error
      - name: Package release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(dist/abr-linux-amd64 version | awk '{print $2}')
          test "$RELEASE_TAG" = "v$version"
          mkdir -p dist/bundle dist/release
          install -m 755 dist/abr-linux-amd64 dist/bundle/abr
          cp -R templates config.example.toml README.md dist/bundle/
          cp dist/abr-linux-amd64 dist/release/
          cp .github/release-notes.md dist/release/release-notes.md
          tar -czf "dist/release/abr_${version}_linux_amd64.tar.gz" -C dist/bundle .
          cd dist/release
          sha256sum abr-linux-amd64 "abr_${version}_linux_amd64.tar.gz" > SHA256SUMS
      - name: Upload release files
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: abr-release
          path: dist/release/
          if-no-files-found: error

  release:
    name: Publish tested release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download tested release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: abr-release
          path: dist/release
      - name: Verify checksums and publish
        working-directory: dist/release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sha256sum --check SHA256SUMS
          gh release create "$RELEASE_TAG" abr-linux-amd64 ./*.tar.gz SHA256SUMS \
            --verify-tag --title "Abr $RELEASE_TAG" --notes-file release-notes.md --latest
