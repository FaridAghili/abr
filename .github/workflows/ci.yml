name: Check and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Check formatting
        run: |
          files=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$files" ]; then
            echo "Run gofmt on:"
            echo "$files"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build Linux AMD64
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist/package
          go build -trimpath -ldflags '-s -w' -o dist/package/abr ./cmd/abr
      - name: Package and checksum
        run: |
          cp -R templates dist/package/templates
          cp config.example.toml dist/package/config.example.toml
          cp README.md dist/package/README.md
          cp -R assets docs dist/package/
          tar -czf dist/abr-linux-amd64.tar.gz -C dist/package abr templates config.example.toml README.md assets docs
          cd dist
          sha256sum abr-linux-amd64.tar.gz > abr-linux-amd64.tar.gz.sha256
      - name: Upload distribution
        uses: actions/upload-artifact@v7
        with:
          name: abr-linux-amd64
          path: |
            dist/abr-linux-amd64.tar.gz
            dist/abr-linux-amd64.tar.gz.sha256
          if-no-files-found: error

  host-smoke:
    name: Disposable Ubuntu host test
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build native production executable
        env:
          CGO_ENABLED: '0'
        run: go build -o bin/abr ./cmd/abr
      - name: Setup and deploy Laravel FPM, Octane, SSR Nuxt, and SPA Nuxt
        run: bash scripts/host-smoke.sh bin/abr
      - name: Host diagnostics on failure
        if: failure()
        run: |
          sudo systemctl --no-pager --full status caddy php8.5-fpm mysql abr-fixture-php-scheduler.service abr-fixture-php-scheduler.timer abr-fixture-octane-octane.service || true
          sudo journalctl --no-pager -b -n 300 || true
          sudo namei -l /var/lib/abr-ci/git/id_ed25519 || true
          sudo getfacl -p /var/lib/abr-ci /var/lib/abr-ci/git /var/lib/abr-ci/git/id_ed25519 /var/lib/abr-ci/git/known_hosts || true
          if getent passwd abr-fixture-php >/dev/null; then
            sudo runuser --user abr-fixture-php -- env -i HOME=/var/lib/abr-users/abr-fixture-php PATH=/usr/bin:/bin git -C /srv/apps/fixture-php status --porcelain || true
          fi
